{% extends "base.html" %}

{% block content %}
<style>
    /* Resetea los estilos del contenedor principal */
    .main-content {
        margin-left: 250px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: calc(100vh - 70px) !important;
        padding: 0 !important;
    }

    .page-content {
        width: 100% !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 60px 20px 60px 20px !important;  /* Más espacio arriba y abajo */
    }

    .page-content .container-fluid {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        display: flex !important;
        justify-content: center !important;
    }

    /* Contenedor de las tarjetas */
    .modules-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        flex-wrap: nowrap;
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 0;        /* Espacio adicional arriba y abajo del contenedor */
    }

    /* Tarjetas más grandes pero que quepan en línea */
    .custom-card,
    .custom-card-opportunity,
    .custom-card-solution {
        width: 320px;
        height: 480px;
        text-align: center;
        color: white;
        border: none;
        border-radius: 25px;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        padding: 35px;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .custom-card:hover,
    .custom-card-opportunity:hover,
    .custom-card-solution:hover {
        transform: translateY(-12px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.35);
    }

    .custom-card { background: linear-gradient(135deg, #6C0B99 0%, #8B1DB8 100%); }
    .custom-card-opportunity { background: linear-gradient(135deg, #FA0C4A 0%, #FF3366 100%); }
    .custom-card-solution { background: linear-gradient(135deg, #33CCFF 0%, #66D9FF 100%); }

    .card-body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 0 !important;
    }

    .module-image {
        width: 100%;
        max-width: 220px;
        height: auto;
        border-radius: 20px;
        margin-bottom: 30px;
    }

    .card-body h4 {
        font-size: 1.7rem;
        font-weight: bold;
        color: rgb(0, 0, 0);
        margin-bottom: 18px;
        line-height: 1.3;
    }

    .card-body p {
        font-size: 1.15rem;
        font-weight: 300;
        color: rgba(0, 0, 0, 0.9);
        line-height: 1.5;
    }

    /* Responsive para pantallas más pequeñas */
    @media (max-width: 1400px) {
        .custom-card,
        .custom-card-opportunity,
        .custom-card-solution {
            width: 300px;
            height: 450px;
        }

        .modules-row {
            gap: 25px;
        }
    }

    @media (max-width: 1200px) {
        .custom-card,
        .custom-card-opportunity,
        .custom-card-solution {
            width: 280px;
            height: 420px;
        }

        .module-image {
            max-width: 190px;
        }

        .card-body h4 {
            font-size: 1.5rem;
        }

        .card-body p {
            font-size: 1.05rem;
        }
    }

    @media (max-width: 991px) {
        .main-content {
            margin-left: 0 !important;
        }

        .modules-row {
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px 0;
        }

        .custom-card,
        .custom-card-opportunity,
        .custom-card-solution {
            width: 300px;
            height: 420px;
        }

        .page-content {
            padding: 40px 20px 40px 20px !important;
        }
    }

    @media (max-width: 768px) {
        .custom-card,
        .custom-card-opportunity,
        .custom-card-solution {
            width: 280px;
            height: 400px;
        }

        .module-image {
            max-width: 170px;
        }

        .page-content {
            padding: 30px 20px 30px 20px !important;
        }
    }
</style>

<div class="container-fluid">
    <div class="modules-row">
        <!-- Tarjeta Módulo de Ideas -->
        <a href="{{ url_for('ideas.list_ideas') }}" class="custom-card">
            <div class="card-body">
                <img src="/static/img/ideas.png" alt="Módulo de Ideas" class="module-image">
                <h4>Módulo de ideas</h4>
                <p>Creación de ideas.</p>
            </div>
        </a>

        <!-- Tarjeta Módulo de Oportunidades -->
        <a href="{{ url_for('vistaOportunidad.list_oportunidades') }}" class="custom-card-opportunity">
            <div class="card-body">
                <img src="/static/img/oportunidad.png" alt="Módulo de Oportunidades" class="module-image">
                <h4>Módulo de Oportunidades</h4>
                <p>Gestión de oportunidades.</p>
            </div>
        </a>

        <!-- Tarjeta Módulo de Soluciones -->
        <a href="{{ url_for('vistaSolucion.list_solucion') }}" class="custom-card-solution">
            <div class="card-body">
                <img src="/static/img/soluciones1.png" alt="Módulo de Soluciones" class="module-image">
                <h4>Módulo de Soluciones</h4>
                <p>Gestión de soluciones.</p>
            </div>
        </a>
    </div>
</div>
{% endblock %}
